<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATAT - {% block title %}{% endblock %}</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png"/>
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/charts.css">
<link rel="stylesheet" href="/static/pages.css">
</head>
<body data-page="{% block page %}{% endblock %}">
<div class="backdrop" aria-hidden="true"><div class="glow"></div></div>
{% with active = self.page(), timebar = false %}{% include "_appbar.html" %}{% endwith %}

<main>
  {% block content %}{% endblock %}
</main>
<script src="/static/charts.js"></script>
<script>
document.querySelectorAll('[data-copy]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(btn.getAttribute('data-copy'));
      btn.classList.add('done');
      setTimeout(() => btn.classList.remove('done'), 1200);
    } catch (e) { /* clipboard blocked: the command is still on screen */ }
  });
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
