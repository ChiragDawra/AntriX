{% macro icon(name) -%}
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'dashboard' -%}
<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'validation' -%}
<path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
{%- elif name == 'columns' -%}
<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/>
{%- elif name == 'api' -%}
<path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 2.5-2 3 1 .5 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5 1 2.5 2 3-1 .5-2 1.5-2 3v2c0 2-1 3-3 3"/>
{%- elif name == 'target' -%}
<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'layers' -%}
<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>
{%- elif name == 'flame' -%}
<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 0 2 1 3 2 3 0-3-1-5.5.5-8z"/>
{%- elif name == 'trend' -%}
<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>
{%- elif name == 'grid' -%}
<circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8M6 8v8M18 8v8M8 18h8"/>
{%- elif name == 'pin' -%}
<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>
{%- elif name == 'info' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == 'warn' -%}
<path d="M12 4l9 16H3l9-16z"/><path d="M12 10v4M12 17h.01"/>
{%- elif name == 'db' -%}
<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
{%- elif name == 'filter' -%}
<path d="M4 5h16l-6 7v6l-4 2v-8L4 5z"/>
{%- elif name == 'download' -%}
<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == 'copy' -%}
<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
{%- elif name == 'search' -%}
<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>
{%- else -%}
<circle cx="12" cy="12" r="8"/>
{%- endif -%}
</svg>
{%- endmacro %}
